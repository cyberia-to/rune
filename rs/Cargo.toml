# ---
# tags: rune, language, config
# crystal-type: source
# crystal-domain: comp
# ---
[workspace]
members = [
    "ast",
    "lex",
    "parse",
    "parse-pure",
    "lower",
    "prysm",
    "interp",
    "subject",
    "mold",
    "compile",
    "cli",
]
resolver = "3"

[workspace.package]
license = "Cyber"

[workspace.dependencies]
rune-ast        = { path = "ast" }
rune-lex        = { path = "lex" }
rune-parse      = { path = "parse" }
rune-parse-pure = { path = "parse-pure" }
rune-lower      = { path = "lower" }
rune-prysm      = { path = "prysm" }
rune-interp     = { path = "interp" }
rune-subject    = { path = "subject" }
rune-mold       = { path = "mold" }
rune-compile    = { path = "compile" }

# stack deps
cyber-hemera = { path = "../../hemera/rs" }

# stack deps — added when compile path lands (M6)
# nox   = { path = "../../nox/rs" }
# nebu  = { package = "cyb-nebu", path = "../../strata/nebu/rs" }
