# CI for rune.
#
# rune is one cargo workspace with one Cargo.lock at the root. It depends on
# sibling crates through path deps (../hemera/rs, ../tade/impl/rust), so every
# job lays out the same stand as the soft3 release train: rune, hemera and tade
# checked out side by side.
# The `lockfile` job resolves that stand and uploads the resulting Cargo.lock as
# an artifact so it can be committed.
# The `test` job runs `cargo test --locked` at the workspace root, exactly the
# release train's `stack-neuron` leg for rune.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # hemera's 0.4 line; set to main once hemera#25 (release/0.4 -> main) lands
  HEMERA_REF: release/0.4
  # empty = tade's default branch
  TADE_REF: ""

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: rune
      - uses: actions/checkout@v4
        with:
          repository: cyberia-to/hemera
          path: hemera
          ref: ${{ env.HEMERA_REF }}
      - uses: actions/checkout@v4
        with:
          repository: cyberia-to/tade
          path: tade
          ref: ${{ env.TADE_REF }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rune
      - name: resolve the stand
        run: cargo metadata --format-version 1 > /dev/null
        working-directory: rune
      - name: Cargo.lock changes
        run: git -C rune diff --stat -- Cargo.lock
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Cargo.lock
          path: rune/Cargo.lock
      - name: committed Cargo.lock matches the stand
        run: |
          git -C rune add -N Cargo.lock
          git -C rune diff --exit-code -- Cargo.lock

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: rune
      - uses: actions/checkout@v4
        with:
          repository: cyberia-to/hemera
          path: hemera
          ref: ${{ env.HEMERA_REF }}
      - uses: actions/checkout@v4
        with:
          repository: cyberia-to/tade
          path: tade
          ref: ${{ env.TADE_REF }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rune
      - name: cargo test
        run: cargo test --locked
        working-directory: rune
