# ---
# tags: rune, language, config
# crystal-type: source
# crystal-domain: comp
# ---
[workspace]
members = [
    "crates/rune-ast",
    "crates/rune-lex",
    "crates/rune-parse",
    "crates/rune-parse-pure",
    "crates/rune-lower",
    "crates/rune-prysm",
    "crates/rune-interp",
    "crates/rune-subject",
    "crates/rune-mold",
    "crates/rune-compile",
    "crates/rune",
]
resolver = "3"

[workspace.dependencies]
rune-ast        = { path = "crates/rune-ast" }
rune-lex        = { path = "crates/rune-lex" }
rune-parse      = { path = "crates/rune-parse" }
rune-parse-pure = { path = "crates/rune-parse-pure" }
rune-lower      = { path = "crates/rune-lower" }
rune-prysm      = { path = "crates/rune-prysm" }
rune-interp     = { path = "crates/rune-interp" }
rune-subject    = { path = "crates/rune-subject" }
rune-mold       = { path = "crates/rune-mold" }
rune-compile    = { path = "crates/rune-compile" }

# stack deps
cyber-hemera = { path = "../hemera/rs" }

# stack deps — added when compile path lands (M6)
# nox   = { path = "../nox/rs" }
# nebu  = { package = "cyb-nebu", path = "../strata/nebu/rs" }
