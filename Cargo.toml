# ---
# tags: rune, language, config
# crystal-type: source
# crystal-domain: comp
# ---
[workspace]
members = [
    "rs/ast",
    "rs/lex",
    "rs/parse",
    "rs/parse-pure",
    "rs/lower",
    "rs/prysm",
    "rs/interp",
    "rs/subject",
    "rs/mold",
    "rs/compile",
    "cli",
]
resolver = "3"

[workspace.package]
license-file = "LICENSE"

[workspace.dependencies]
rune-ast        = { version = "0.1.0", path = "rs/ast" }
rune-lex        = { version = "0.1.0", path = "rs/lex" }
rune-parse      = { version = "0.1.0", path = "rs/parse" }
rune-parse-pure = { version = "0.1.0", path = "rs/parse-pure" }
rune-lower      = { version = "0.1.0", path = "rs/lower" }
rune-prysm      = { version = "0.1.0", path = "rs/prysm" }
rune-interp     = { version = "0.1.0", path = "rs/interp" }
rune-subject    = { version = "0.1.0", path = "rs/subject" }
rune-mold       = { version = "0.1.0", path = "rs/mold" }
rune-compile    = { version = "0.1.0", path = "rs/compile" }

# stack deps
cyber-hemera = { version = "0.3", path = "../hemera/rs" }
tape         = { package = "cyber-tape", path = "../tape/impl/rust" }

# cli deps
reedline     = "0.45"
nu-ansi-term = "0.50"

# stack deps — added when compile path lands (M6)
# nox   = { path = "../nox/rs" }
# nebu  = { package = "strata-nebu", path = "../strata/nebu/rs" }
